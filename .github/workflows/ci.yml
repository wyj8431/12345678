name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  quality-gates:
    name: Build, test, smoke, audit
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      USE_MOCK_DB: "true"
      VECTOR_PROVIDER: mock
      DEFAULT_USER_ID: "1"
      DEFAULT_USER_ROLE: admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: End-to-end smoke test
        run: npm run smoke

      - name: Dependency audit
        run: npm audit --audit-level=moderate
